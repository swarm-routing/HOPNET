name: Release

# The org release pipeline (swarm-routing/.github reusable-release.yml;
# CONTRIBUTING "Cutting a release" there):
#   dispatch `dry-run`  bump, build, attest and verify on the runner only;
#   dispatch `bump`     open the PR `chore(release): bump version A to B`
#                       from bot/release (Commitizen, .cz.toml);
#   merge that PR       the release: `make dist` builds hopnet-<ver>.tar.gz
#                       (core/ with its LICENSE, ns3/, docs/), then SBOM, checksums, signed provenance,
#                       the v<ver> tag and the GitHub release, whose notes are
#                       the version's CHANGELOG.md section (.cz-changelog.md.j2
#                       adds the release status: v0.1.0 has not cleared the gates).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run: bump, build, attest and verify on the runner only; bump: open the bump PR (merging it releases); release-notes: re-render the notes of the release `tag` from CHANGELOG.md"
        type: choice
        options: [dry-run, bump, release-notes]
        default: dry-run
      increment:
        description: "auto: Commitizen picks the bump from the commits; PATCH, MINOR or MAJOR force it (cz bump --increment; when the version the ladder fixes differs, swarm-routing/.github#512)"
        type: choice
        options: [auto, PATCH, MINOR, MAJOR]   # a choice cannot be empty: auto is passed as ''
        default: auto
      tag:
        description: "release-notes only: the existing release whose notes are re-rendered, vX.Y.Z (swarm-routing/.github#524)"
        type: string
        default: ''
  push:
    branches: [main]   # the merged bump PR releases; any other push is a no-op
permissions:
  contents: read
# One run per commit at a time, never cancelled (a later run must not replace
# a merged bump's pending release).
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  release:
    # Saves a runner on ordinary pushes; the workflow itself checks the PR.
    if: "${{ github.event_name != 'push' || startsWith(github.event.head_commit.message, 'chore(release): bump version ') }}"
    permissions: { contents: write, pull-requests: write, id-token: write, attestations: write }
    uses: swarm-routing/.github/.github/workflows/reusable-release.yml@f1d7b404ac831985d7db36a30b5d64d0309f76c8 # main@2026-11-23
    with:
      mode: ${{ inputs.mode }}   # empty on push: release
      increment: ${{ inputs.increment != 'auto' && inputs.increment || '' }}   # '' for auto and on push
      tag: ${{ inputs.tag }}   # release-notes only; '' on push (swarm-routing/.github#524)
      vcpkg-ports: hopnet-core   # after publish, the org bot opens the port PR in swarm-routing/vcpkg-registry (swarm-routing/.github#439)
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      ORG_BOT_TOKEN: ${{ secrets.ORG_BOT_TOKEN }}
