name: Core

# core/ on its own (no ns-3 tree): the org's strict warnings as errors, the
# unit tests under ctest, the same under ASan + UBSan, clang-format with the
# org style, and the vendored swarm-core files checked against their pin
# (core/swarm-core/README.md). The ns-3 module joins reusable-ns3-ci.yml once
# ns3/ exists. Check names (stable, for required_checks): core-test, core-format.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vendored swarm-core matches core/swarm-core/PIN
        run: |
          pin=$(cat core/swarm-core/PIN)
          git init -q "$RUNNER_TEMP/swarm-core"
          git -C "$RUNNER_TEMP/swarm-core" fetch -q --depth 1 \
            https://github.com/swarm-routing/ns3-swarm-core "$pin"
          git -C "$RUNNER_TEMP/swarm-core" checkout -q --detach FETCH_HEAD
          status=0
          for f in core/swarm-core/*.h core/swarm-core/*.cc; do
            diff -u "$RUNNER_TEMP/swarm-core/core/$(basename "$f")" "$f" || status=1
          done
          exit "$status"
      - name: Build (strict warnings as errors) and test
        run: |
          cmake -S core -B build/core -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/core -j
          ctest --test-dir build/core --output-on-failure
      - name: Build and test under ASan + UBSan
        run: |
          cmake -S core -B build/sanitized -DCMAKE_BUILD_TYPE=Debug -DHOPNET_CORE_SANITIZE=ON
          cmake --build build/sanitized -j
          ctest --test-dir build/sanitized --output-on-failure

  core-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Org .clang-format unless the repo ships its own
        run: |
          [ -f .clang-format ] || curl -fsSL -o .clang-format \
            https://raw.githubusercontent.com/swarm-routing/.github/main/.clang-format
      - name: clang-format-18 --dry-run -Werror
        run: |
          files=$(git ls-files '*.h' '*.cc' '*.cpp' '*.hpp')
          [ -z "$files" ] && { echo "no C++ files"; exit 0; }
          # shellcheck disable=SC2086
          clang-format-18 --dry-run -Werror $files
