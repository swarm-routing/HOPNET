name: Core

# core/ on its own (no ns-3 tree): the org's strict warnings as errors, the
# unit tests under ctest, the same under ASan + UBSan, and clang-format with the
# org style. swarm-core's primitives come from its vcpkg port
# (swarm-routing/.github#489): vcpkg.json pins the version swarm-core.lock
# names, vcpkg-configuration.json the swarm-routing/vcpkg-registry baseline,
# and swarm-routing/.github's setup-vcpkg action gives the tool (its binary
# cache on GitHub Packages is off here, see the step). The ns-3 module (ns3/) runs in ns3.yml, on
# reusable-ns3-ci.yml. Check names (stable, for required_checks): core-test, core-format.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

# A newer push to the same pull request cancels this run (swarm-routing/.github#505):
# runners are shared by the whole org. Pushes, merge groups and dispatches run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      # a docs-only change skips the steps below; the check still reports (swarm-routing/.github#581)
      - uses: swarm-routing/.github/.github/actions/changes@fba9e07e50d1a8c79f7d3e2d0a3dad2b11c91e19 # main@2026-11-25
        id: changes
        timeout-minutes: 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.docs-only != 'true'
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.docs-only != 'true'
        with:
          repository: swarm-routing/.github
          path: .org
          sparse-checkout: .clang-tidy
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: vcpkg (swarm-routing/.github#489)
        if: steps.changes.outputs.docs-only != 'true'
        id: vcpkg
        uses: swarm-routing/.github/.github/actions/setup-vcpkg@fba9e07e50d1a8c79f7d3e2d0a3dad2b11c91e19 # main@2026-11-25
        timeout-minutes: 8
        with:
          # The NuGet cache needs mono on the runner (28-50 s to install); the
          # three ports it would restore build in about 5 s, so here it costs
          # more than it saves (measured on swarm-routing/ARA#176,
          # swarm-routing/.github#489). Turn it on when the ports grow.
          binary-cache: 'off'
      # one vcpkg_installed for every configure below: the port is installed once
      - name: Build (strict warnings as errors) and test (swarm-core from its vcpkg port)
        if: steps.changes.outputs.docs-only != 'true'
        env:
          TOOLCHAIN: ${{ steps.vcpkg.outputs.toolchain }}
        run: |
          cmake -S core -B build/core -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DVCPKG_INSTALLED_DIR="$PWD/build/vcpkg_installed"
          cmake --build build/core -j
          ctest --test-dir build/core --output-on-failure
      - name: clang-tidy (org .clang-tidy, findings are errors; core/ sources, tests excluded; swarm-routing/.github#635)
        if: steps.changes.outputs.docs-only != 'true'
        timeout-minutes: 5
        run: |
          git ls-files 'core/*.cc' ':!core/test/**' | xargs clang-tidy-18 -p build/core --config-file=.org/.clang-tidy --warnings-as-errors='*' --header-filter="^$PWD/core/[^/]+\.h$" --quiet
      - name: Build and test under ASan + UBSan (HOPNET instrumented, swarm-core the port as published)
        if: steps.changes.outputs.docs-only != 'true'
        env:
          TOOLCHAIN: ${{ steps.vcpkg.outputs.toolchain }}
        run: |
          cmake -S core -B build/sanitized -DCMAKE_BUILD_TYPE=Debug -DHOPNET_CORE_SANITIZE=ON \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DVCPKG_INSTALLED_DIR="$PWD/build/vcpkg_installed"
          cmake --build build/sanitized -j
          ctest --test-dir build/sanitized --output-on-failure
      - name: The CMake package hopnet-core (find_package, on the swarm-core port; swarm-routing/.github#436)
        if: steps.changes.outputs.docs-only != 'true'
        env:
          TOOLCHAIN: ${{ steps.vcpkg.outputs.toolchain }}
        run: |
          prefix="$PWD/build/prefix"
          installed="$PWD/build/vcpkg_installed"
          cmake -S core -B build/pkg -DCMAKE_BUILD_TYPE=Release -DHOPNET_CORE_INSTALL=ON -DHOPNET_CORE_TESTS=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DVCPKG_INSTALLED_DIR="$installed"
          cmake --build build/pkg -j "$(nproc)" && cmake --install build/pkg --prefix "$prefix"
          for f in lib/libhopnet_core.a lib/cmake/hopnet-core/hopnet-coreConfig.cmake lib/cmake/hopnet-core/hopnet-coreConfigVersion.cmake lib/cmake/hopnet-core/hopnet-coreTargets.cmake; do
            test -f "$prefix/$f" || { echo "::error::the install has no $f"; exit 1; }
          done
          cmake -S core/test/consumer-package -B build/consumer -DCMAKE_PREFIX_PATH="$prefix;$installed/x64-linux"
          cmake --build build/consumer && build/consumer/consumer

  core-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      # a docs-only change skips the steps below; the check still reports (swarm-routing/.github#581)
      - uses: swarm-routing/.github/.github/actions/changes@fba9e07e50d1a8c79f7d3e2d0a3dad2b11c91e19 # main@2026-11-25
        id: changes
        timeout-minutes: 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.docs-only != 'true'
        with:
          persist-credentials: false
      - name: Org .clang-format unless the repo ships its own
        if: steps.changes.outputs.docs-only != 'true'
        run: |
          [ -f .clang-format ] || curl -fsSL -o .clang-format \
            https://raw.githubusercontent.com/swarm-routing/.github/main/.clang-format
      - name: clang-format-18 --dry-run -Werror
        if: steps.changes.outputs.docs-only != 'true'
        run: |
          files=$(git ls-files '*.h' '*.cc' '*.cpp' '*.hpp')
          [ -z "$files" ] && { echo "no C++ files"; exit 0; }
          # shellcheck disable=SC2086
          clang-format-18 --dry-run -Werror $files
