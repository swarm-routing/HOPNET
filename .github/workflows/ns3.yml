name: ns-3

# The `hopnet` contrib module (ns3/, which compiles core/ as well) in
# ghcr.io/swarm-routing/ns3-dev (debug and sanitized, the release ns-3
# supports), on the swarm-core release swarm-core.lock names (its `main` in
# the canary leg), with the org quality gates: strict warnings, coverage
# (report-only, to Codecov), determinism, clang-format and licence headers.
# SonarQube Cloud stays off until the repository has a project there
# (org-sync.toml `sonar = false`, swarm-routing/.github#104). routing-bench
# (swarm-routing/ns3-tools) is built beside it so the harness arm
# (ns3/helper/hopnet-bench-arms.cc) compiles and runs.
#
# core/ also builds alone against the same swarm-core release, from its vcpkg
# port (core.yml; swarm-routing/.github#489). This module builds on the same release (the tag in `dependencies`,
# and in core-deps below); `canary-dependencies` builds on swarm-core and
# ns3-tools main in one non-blocking leg on push, schedule and dispatch, never on
# a PR (swarm-routing/.github#411). The `swarm-core / pin` check keeps every tag
# on the lock's (swarm-routing/ns3-swarm-core#134).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # its checks are required, so the merge queue runs them too (swarm-routing/.github#130)
  schedule:
    - cron: '17 4 * * 1'  # weekly: the canary leg on a quiet main
  workflow_dispatch:
    inputs:
      ns3-versions:
        description: 'On demand: JSON list of older ns-3 releases (3.42+), e.g. ["3.48"]'
        default: ''
      profiles:
        description: 'On demand: JSON list of image profiles. Older releases have a debug image; a sanitized one only where it was built on request (e.g. 3.48)'
        default: '["debug"]'

permissions:
  contents: read
  packages: read

# A newer push to the same pull request cancels this run (swarm-routing/.github#505):
# runners are shared by the whole org. Pushes, merge groups and dispatches run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: swarm-routing/.github/.github/workflows/reusable-ns3-ci.yml@3dc15c141b4e5a23b2178a5da77e07b562437a1c # main@2026-11-26
    with:
      modules: hopnet=ns3
      # released versions (swarm-routing/ns3-swarm-core#134); the moving refs in the
      # non-blocking canary leg, outside PRs (swarm-routing/.github#411)
      dependencies: |
        swarm-core=swarm-routing/swarm-adapter-ns3@v2.1.0
        routing-bench=swarm-routing/ns3-tools@v1.0.0:ns3/routing-bench
      canary-dependencies: |
        swarm-core=swarm-routing/swarm-adapter-ns3@main
        routing-bench=swarm-routing/ns3-tools@main:ns3/routing-bench
      ns3-versions: ${{ inputs.ns3-versions || '["latest"]' }}
      profiles: ${{ inputs.ns3-versions != '' && inputs.profiles || '["debug", "sanitized"]' }}
      # Older images may predate these options: automatic `latest` legs only.
      strict-warnings: ${{ inputs.ns3-versions == '' }}
      coverage: ${{ inputs.ns3-versions == '' }}
      sonar: false
      # The delivery smoke through the harness, as ns3-tools runs its stock arms.
      run: routing-compare --scenario=paper --nNodes=20 --time=30 --runs=1 --protocols=hopnet
      determinism: hopnet-example --seed={seed}
      dual-roots: 'core/'
      core-roots: 'core/'
      core-deps: swarm-routing/swarm-core@392e84d98cefd45db184d0788c264621f2e58192:core

  # The coverage report of the `ci` job to Codecov (report-only; GitHub OIDC).
  codecov:
    needs: ci
    if: inputs.ns3-versions == ''
    permissions:
      contents: read
      id-token: write
    uses: swarm-routing/.github/.github/workflows/reusable-codecov.yml@3dc15c141b4e5a23b2178a5da77e07b562437a1c # main@2026-11-26
