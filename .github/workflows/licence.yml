name: Licence

# core/ is MIT OR GPL-2.0-only and includes only the C++ standard library,
# other core/ files and swarm-core's dual-licensed core/ at the release
# swarm-core.lock names (org-bot bumps both together); everything
# else is GPL-2.0-only (LICENSING.md).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

jobs:
  headers:
    uses: swarm-routing/.github/.github/workflows/reusable-licence-check.yml@4ca39e56878af1b23a028c602d554a6f696b2ac2 # main@2026-11-27
    with:
      dual-roots: core/
      core-roots: core/
      core-deps: swarm-routing/swarm-core@392e84d98cefd45db184d0788c264621f2e58192:core
