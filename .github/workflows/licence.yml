name: Licence

# core/ is MIT OR GPL-2.0-only and includes only the C++ standard library,
# other core/ files and swarm-core's dual-licensed core/ at the release
# swarm-core.lock names (org-bot bumps both together); everything
# else is GPL-2.0-only (LICENSING.md).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

jobs:
  headers:
    uses: swarm-routing/.github/.github/workflows/reusable-licence-check.yml@c9358e3eedf318ba57e37a9bb3c51d1057d657ac # main@2026-11-22
    with:
      dual-roots: core/
      core-roots: core/
      core-deps: swarm-routing/ns3-swarm-core@ff097aeb1f6237fb9796ff4713e91524fb5b4d3f:core
