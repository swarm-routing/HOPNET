# org-sync configuration (swarm-routing/.github tools/org-sync).
kind = "protocol"
# CITATION.cff seed and cite badge. Once Zenodo archives a release: set zenodo_concept = "<record id>"
# (read from Zenodo), then `org_sync.py reseed CITATION.cff` so CITATION.cff names the DOI.
citation = true
# the Zenodo concept record (read from zenodo.org on 2026-11-11, v0.1.0 archived)
zenodo_concept = "24125265"
title = "HOPNET"
dual = ["core/"]

# No SonarQube Cloud project yet (swarm-routing/.github#104): no Sonar badges or
# sonar-project.properties until the repository is imported there and has code.
[quality]
sonar = false

[settings]
# GitHub settings as code: swarm-routing/.github tools/repo-settings (swarm-routing/.github#117).
description = "HOPNET (Wang, 2007) as a standalone swarm routing protocol for MANETs: ant-colony routing over routing zones, proactive inside a zone and reactive between zones. Planned as a simulator-agnostic C++ core and an ns-3 contrib module on swarm-core."
homepage = "https://swarm-routing.github.io/arena/HOPNET/"
topics = ["hopnet", "ant-colony-optimization", "aco", "zone-routing", "swarm-intelligence", "manet", "ad-hoc-routing", "routing-protocol", "ns-3"]
ruleset = "protocol"
required_checks = ["check / org-sync", "headers / licence", "title / title", "core-test", "core-format", "swarm-core / pin"]
# Merge through a merge queue (swarm-routing/.github#130); every workflow behind a required
# check also runs on merge_group.
merge_queue = true

# The work this repository implements or builds on: the README's Releases &
# citing list and CITATION.cff's references (swarm-routing/.github org-sync,
# #228). Every DOI confirmed with lit_search.py confirm; fields from Crossref.

[[references]]
type = "thesis"
title = "HOPNET: A Hybrid ant colony OPtimization routing algorithm for Mobile ad hoc NETwork"
authors = ["Wang, Jianping"]
year = 2007
venue = "University of Manitoba"
thesis_type = "MSc thesis"
url = "https://hdl.handle.net/1993/20935"
no_doi = "a thesis in the University of Manitoba's MSpace repository."
role = "The primary source this repository implements; docs/fidelity.md maps it to the code and marks the repository choices."

[[references]]
type = "article"
title = "HOPNET: A hybrid ant colony optimization routing algorithm for mobile ad hoc network"
